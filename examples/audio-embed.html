<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intellign Tools — Audio V1 embeds</title>
  <style>
    body{margin:0;padding:32px;background:#080808;color:#fff;font:14px system-ui,sans-serif}
    main{max-width:1100px;margin:auto}h1{font-size:40px;letter-spacing:-.04em}
    p{color:#888}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    article{border:1px solid #252525;border-radius:22px;overflow:hidden;background:#0c0c0c}
    h2{font-size:16px;margin:0;padding:16px;border-bottom:1px solid #252525}
    iframe{display:block;width:100%;height:560px;border:0;background:#050505}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <h1>Intellign Audio V1</h1>
  <p>Canonical hosted tools in compact mode. Audio SDK exports are intentionally not represented here yet.</p>
  <div class="grid">
    <article><h2>BPM + Key</h2><iframe src="https://tools.intellign.us/bpm-key-finder?compact" title="Intellign BPM and Key Finder"></iframe></article>
    <article><h2>Audio Converter</h2><iframe src="https://tools.intellign.us/audio-converter?compact" title="Intellign Audio Converter"></iframe></article>
    <article><h2>Audio Compressor</h2><iframe src="https://tools.intellign.us/audio-compressor?compact" title="Intellign Audio Compressor"></iframe></article>
    <article><h2>Master Check</h2><iframe src="https://tools.intellign.us/master-check?compact" title="Intellign Master Check"></iframe></article>
  </div>
</main>
</body>
</html>
